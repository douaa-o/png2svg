[project]
name = "png2svg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "ouguzine.douaa@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pillow>=13.0.0",
]

[project.scripts]
png2svg = "png2svg.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.25.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
